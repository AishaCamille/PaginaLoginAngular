<body>
    <div class="auth-container">
        <h2>
            {{isLoginMode ? 'Login' : 'Cadastro' }}
        </h2>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" >
            @if(!isLoginMode){
                <div class="EmailSenha">
                    <label for="name">
                        Nome:
                    </label>
                    <input id="name" formControlName="name">
                </div>
            }
            <div class="EmailSenha">
                <label for="email">Email: </label>
                <input id="email" formControlName="email" type="email">

                <label for="password">Senha: </label>
                <input id="password" type="password" formControlName="password" 
                [placeholder]="isLoginMode ? '' : 'Informe pelo menos 6 digitos'">
                </div>
            <button type="submit">{{isLoginMode ? 'entrar' : 'Cadastrar' }}</button>
        </form>
        <p>
            {{isLoginMode ? 'Não tem conta?' : 'Já tem conta?' }}
            <button (click)="toggleMode()">{{isLoginMode ? 'criar conta' : 'fazer login' }}</button>
        </p>
    </div>
</body>
<!--formgroup e ng são variaveis de funções do angular-->
